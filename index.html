<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desi Duel - Rahul vs Palak</title>

  <!-- PeerJS for Multiplayer Game Connectivity -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <!-- Agora Web Voice Chat SDK -->
  <script src="https://download.agora.io/sdk/web/AgoraRTC_N-4.20.0.js"></script>

  <style>
    :root { --bg: #0f111a; --card: #1a1d2e; --accent: #f1c40f; --red: #e74c3c; --green: #2ecc71; }
    * { box-sizing: border-box; webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); font-family: system-ui, sans-serif; color: #fff; }
    #gameBox { width: 100vw; height: 100vh; background: radial-gradient(circle at center, #1e2238 0%, var(--bg) 100%); display: flex; flex-direction: column; justify-content: space-between; position: relative; }
    h1 { margin: 0; font-size: clamp(16px, 3vw, 24px); color: var(--accent); text-align: center; margin-top: 5px; }
    #lobby { background: var(--card); border: 2px solid var(--accent); border-radius: 12px; padding: 15px; width: 90%; max-width: 400px; margin: auto; text-align: center; }
    .input-box { width: 100%; padding: 8px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #333; background: #0b0d14; color: #fff; text-align: center; font-size: 14px; }
    .btn { width: 100%; padding: 10px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-top: 5px; }
    .btn-primary { background: #3498db; color: #fff; }
    .btn-solo { background: #a67c17; margin-top: 10px; }
    #arena { display: none; position: relative; width: 100%; flex: 1; background: linear-gradient(#4b79a1, #283e51); overflow: hidden; }
    .fighter { position: absolute; bottom: 60px; width: 100px; height: 120px; text-align: center; transition: left 0.1s linear, transform 0.1s ease; }
    .fighter img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #fff; object-fit: cover; }
    .hp-bar { width: 100%; height: 10px; background: #555; border-radius: 5px; overflow: hidden; margin-top: 5px; }
    .hp-fill { height: 100%; width: 100%; background: var(--green); transition: width 0.2s ease; }
    #ground { position: absolute; bottom: 0; width: 100%; height: 60px; background: #111; border-top: 4px solid var(--accent); }
    .controls { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 8px; padding: 10px; background: #000000aa; }
    .ctrl-btn { padding: 15px; font-size: 18px; font-weight: bold; border-radius: 8px; border: none; background: #333; color: #fff; active: background: #555; }
    .btn-hit { background: var(--red); }
    .hit { animation: shake 0.2s ease; }
    @keyframes shake { 0%{transform: translateX(0);} 25%{transform: translateX(-10px);} 75%{transform: translateX(10px);} 100%{transform: translateX(0);} }

    /* Floating Mic Button Styling */
    #voice-controls {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 99999;
    }
    #mic-btn {
      padding: 8px 16px;
      background-color: #22c55e;
      color: #ffffff;
      border: 2px solid #ffffff;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <!-- Floating Mic Button -->
  <div id="voice-controls">
    <button id="mic-btn" onclick="toggleMic()">🎙️ Mic ON</button>
  </div>

  <div id="gameBox">
    <h1>DESI DUEL: RAHUL VS PALAK</h1>

    <!-- Lobby -->
    <div id="lobby">
      <p style="margin-top:0;">Your ID: <b id="myId" style="color:var(--accent);">Generating...</b></p>
      <input type="text" id="peerIdInput" class="input-box" placeholder="Enter Friend's ID" />
      <button class="btn btn-primary" onclick="connectToPeer()">Connect Friend</button>
      <button class="btn btn-solo" onclick="startSoloMode()">Play Solo vs Bot</button>
      <p id="status" style="font-size:12px; color:#aaa; margin-bottom:0; margin-top:8px;">Waiting for connection...</p>
    </div>

    <!-- Arena -->
    <div id="arena">
      <div id="rahul" class="fighter" style="left: 10%;">
        <div class="hp-bar"><div id="hpRahul" class="hp-fill"></div></div>
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Rahul" alt="Rahul" />
        <div style="font-weight:bold; font-size:12px;">RAHUL 🥊</div>
      </div>

      <div id="palak" class="fighter" style="left: 70%;">
        <div class="hp-bar"><div id="hpPalak" class="hp-fill"></div></div>
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Palak" alt="Palak" />
        <div style="font-weight:bold; font-size:12px;">PALAK 👡</div>
      </div>
      <div id="ground"></div>
    </div>

    <!-- Controls -->
    <div class="controls" id="controlsBox" style="display:none;">
      <button class="ctrl-btn" onclick="move(-20)">⬅️ Left</button>
      <button class="ctrl-btn" onclick="move(20)">Right ➡️</button>
      <button class="ctrl-btn btn-hit" onclick="attack()">ATTACK 💥</button>
    </div>
  </div>

  <!-- Audio Effects -->
  <audio id="sndChappal" src="chappal.mp3"></audio>
  <audio id="sndKiss" src="kiss.mp3"></audio>
  <audio id="sndRahulHit" src="rahul_hit.mp3"></audio>
  <audio id="sndPalakHit" src="palak_hit.mp3"></audio>

  <script>
    // Audio Player Helper
    function playAudio(elemId) {
      const a = document.getElementById(elemId);
      if(a) { a.currentTime = 0; a.play().catch(()=>{}); }
    }

    // PeerJS Game Setup
    let peer, conn;
    let myRole = 'rahul'; 
    let isSolo = false;
    let pos = { rahul: 10, palak: 70 };
    let hp = { rahul: 100, palak: 100 };

    peer = new Peer();
    peer.on('open', id => { document.getElementById('myId').innerText = id; });

    peer.on('connection', c => {
      conn = c;
      myRole = 'palak';
      setupConn();
      startGame();
    });

    function connectToPeer() {
      const destId = document.getElementById('peerIdInput').value.trim();
      if(!destId) return alert('Enter a valid ID!');
      conn = peer.connect(destId);
      myRole = 'rahul';
      setupConn();
      startGame();
    }

    function setupConn() {
      document.getElementById('status').innerText = "Connected!";
      conn.on('data', data => {
        if(data.type === 'state') {
          pos = data.pos;
          hp = data.hp;
          updateUI();
        } else if(data.type === 'hit') {
          playAudio(data.victim === 'rahul' ? 'sndRahulHit' : 'sndPalakHit');
        }
      });
    }

    function startSoloMode() {
      isSolo = true;
      startGame();
    }

    function startGame() {
      document.getElementById('lobby').style.display = 'none';
      document.getElementById('arena').style.display = 'block';
      document.getElementById('controlsBox').style.display = 'grid';
      updateUI();
    }

    function move(dir) {
      pos[myRole] = Math.max(0, Math.min(80, pos[myRole] + dir));
      sync();
    }

    function attack() {
      const opponent = myRole === 'rahul' ? 'palak' : 'rahul';
      if(Math.abs(pos.rahul - pos.palak) < 20) {
        applyHit(opponent, 15);
        if(conn) conn.send({ type: 'hit', victim: opponent });
        playAudio(myRole === 'rahul' ? 'sndKiss' : 'sndChappal');
      }
      sync();
    }

    function applyHit(victim, dmg) {
      playAudio(victim === 'rahul' ? 'sndRahulHit' : 'sndPalakHit');
      hp[victim] = Math.max(0, hp[victim] - dmg);
      document.getElementById(victim === 'rahul' ? 'hpRahul' : 'hpPalak').style.width = hp[victim] + '%';
      const el = document.getElementById(victim);
      el.classList.add('hit');
      const arena = document.getElementById('arena');
      arena.style.background = '#c0392b';
      setTimeout(() => {
        arena.style.background = 'linear-gradient(#4b79a1, #283e51)';
        el.classList.remove('hit');
      }, 200);

      if(hp[victim] <= 0) {
        setTimeout(() => {
          alert(`${victim === 'rahul' ? 'PALAK 👡' : 'RAHUL 🥊'} WINS!`);
          location.reload();
        }, 300);
      }
    }

    function sync() {
      updateUI();
      if(conn) conn.send({ type: 'state', pos, hp });
    }

    function updateUI() {
      document.getElementById('rahul').style.left = pos.rahul + '%';
      document.getElementById('palak').style.left = pos.palak + '%';
      document.getElementById('hpRahul').style.width = hp.rahul + '%';
      document.getElementById('hpPalak').style.width = hp.palak + '%';
    }

    // AGORA LIVE VOICE CHAT CODE
    const APP_ID = "7210d406ce5141bfa0b905a003c0e298";
    const CHANNEL = "desi-duel-room";
    
    let client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
    let localAudioTrack = null;
    let isMicOn = false;

    async function toggleMic() {
      const btn = document.getElementById("mic-btn");
      try {
        if (!isMicOn) {
          await client.join(APP_ID, CHANNEL, null, null);
          localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();
          await client.publish([localAudioTrack]);
          btn.innerText = "🎙️ Voice Active";
          btn.style.backgroundColor = "#22c55e";
          isMicOn = true;
        } else {
          if (localAudioTrack) localAudioTrack.close();
          await client.leave();
          btn.innerText = "🔇 Mic Muted";
          btn.style.backgroundColor = "#ef4444";
          isMicOn = false;
        }
      } catch (err) {
        console.error(err);
        alert("Microphone permission allow karein!");
      }
    }

    client.on("user-published", async (user, mediaType) => {
      await client.subscribe(user, mediaType);
      if (mediaType === "audio") user.audioTrack.play();
    });
  </script>
</body>
</html>
